spring.application.name=Tuition Fee Manager Backend
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/tuition_fee_manager}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.url=${JWT_URL:/api/v1/login/non-type}
jwt.header=${JWT_HEADER:Authorization}
jwt.secret=${JWT_SECRET}
jwt.prefix=${JWT_PREFIX:Bearer}
jwt.expiration=${JWT_EXPIRATION:86400}
server.port=${SERVER_PORT:1600}

payos.client-id=${ENV_PAYOS_CLIENT_ID}
payos.api-key=${ENV_PAYOS_API_KEY}
payos.checksum-key=${ENV_PAYOS_CHECKSUM_KEY}
payos.cancel-url=${ENV_PAYOS_CANCEL_URL:http://localhost:8080/payment/cancel}
payos.return-url=${ENV_PAYOS_RETURN_URL:http://localhost:8080/payment/return}
payos.url=${ENV_PAYOS_URL:https://api-merchant.payos.vn}
